# Dev container overrides.
#
# devcontainer.json layers this on top of ../docker-compose.dev.yml (the repo's
# dev Postgres), so the database definition keeps a single source of truth.
# Only the dev container's deviations live here.
services:
  app:
    image: turf-tools-dev
    build:
      # Relative to the compose project directory, which is the repo root
      # because devcontainer.json passes ../docker-compose.dev.yml first.
      context: .devcontainer
      dockerfile: Dockerfile
    command: sleep infinity
    working_dir: /workspaces/turf-tools
    # Fedora/RHEL: let the bind-mounted workspace through without relabeling it.
    security_opt:
      - label=disable
    environment:
      # On the compose network the database is `postgres`, so readiness
      # checks and connection strings point there. Host development keeps the
      # repo default of 127.0.0.1.
      DB_HOST: postgres
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/postgres
      QW_METASTORE_URI: postgres://postgres:postgres@postgres:5432/quickwit
      # Tells db:up / dev:db to skip starting a compose database of their own.
      IN_DEVCONTAINER: "1"
      # node.yaml binds loopback by default, which forwarded ports cannot reach.
      QW_LISTEN_ADDRESS: 0.0.0.0
      # Without this pnpm resolves its store inside the workspace and creates a
      # multi-gigabyte .pnpm-store next to the checkout.
      npm_config_store_dir: /home/node/.local/share/pnpm/store
    volumes:
      # `.` is the repo root here: the compose project directory is the repo,
      # since devcontainer.json lists ../docker-compose.dev.yml first.
      - .:/workspaces/turf-tools
      # Dependencies live in the container, not on the host. A shared
      # node_modules means the container and a host `pnpm install` fight over
      # the same tree (different stores, different platforms), and the host
      # setup must keep working untouched. Python's venv gets the same
      # treatment for the same reason.
      - node-modules:/workspaces/turf-tools/node_modules
      - node-modules-web:/workspaces/turf-tools/apps/web/node_modules
      - node-modules-native:/workspaces/turf-tools/apps/native/node_modules
      - node-modules-db:/workspaces/turf-tools/packages/db/node_modules
      - node-modules-scripts:/workspaces/turf-tools/scripts/node_modules
      - python-venv:/workspaces/turf-tools/apps/data/.venv
    depends_on:
      postgres:
        condition: service_healthy
    # Loopback only. VS Code forwards these anyway; publishing them also makes
    # the CLI workflow usable from a browser. They collide with a host-native
    # `pnpm dev`, so run one or the other.
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:8081:8081"
      - "127.0.0.1:7280:7280"

  postgres:
    # Rootless Podman with `userns = "keep-id"` otherwise starts the image as
    # uid 1000, and initdb fails to take ownership of its volume. Container root
    # maps to the invoking user there; this is the image default under Docker.
    user: "0:0"
    # The repo's compose publishes 127.0.0.1:5432 for host-mode development.
    # The dev container reaches the database over the compose network instead,
    # so the publish is dropped rather than colliding with the host.
    ports: !reset []

volumes:
  # Container-only dependency trees; see the app service above.
  node-modules:
  node-modules-web:
  node-modules-native:
  node-modules-db:
  node-modules-scripts:
  python-venv:
