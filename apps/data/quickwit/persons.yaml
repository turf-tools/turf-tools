version: 0.7
index_id: persons
doc_mapping:
  field_mappings:
    - name: external_id
      type: text
      tokenizer: raw
      stored: true
    - name: external_id_type
      type: text
      tokenizer: raw
      stored: true
    - name: first_name
      type: text
      stored: true
    - name: last_name
      type: text
      stored: true
    - name: address_line_1
      type: text
      stored: true
    - name: address_line_2
      type: text
      tokenizer: raw
      stored: true
    - name: city
      type: text
      stored: true
    - name: state
      type: text
      tokenizer: raw
      stored: true
    - name: zip5
      type: text
      tokenizer: raw
      stored: true
    - name: zip4
      type: text
      tokenizer: raw
      stored: true
    # Alphabetical sort key for the Lookup list. Quickwit 0.8.2 can't sort on a
    # text field, so the first 16 chars of "LAST FIRST" are packed into two
    # big-endian u64 fast fields (see dags/quickwit.py); u64 order then matches
    # lexicographic order, so sorting by (hi, lo) gives A→Z. Not returned.
    - name: sort_key_hi
      type: u64
      fast: true
      stored: false
    - name: sort_key_lo
      type: u64
      fast: true
      stored: false
search_settings:
  default_search_fields:
    - first_name
    - last_name
    - address_line_1
    - city
