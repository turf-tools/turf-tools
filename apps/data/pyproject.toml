[project]
name = "data"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "asyncpg>=0.29.0",
  "duckdb>=1.5.1",
  "fastapi>=0.135.3",
  "pydantic-settings>=2.9.1",
  "requests>=2.33.1",
  "sf-hamilton[visualization]>=1.89.0",
  "uvicorn[standard]>=0.42.0",
]

[project.scripts]
update-visualizations = "src.cli:update_visualizations"
seed-boundaries = "src.cli:seed_boundaries"
seed-persons = "src.cli:seed_persons"
mirror-org-data = "src.cli:mirror_org_data"
rename-org-schema = "src.cli:rename_org_schema"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]


[dependency-groups]
dev = ["pytest>=9.0.2", "ruff>=0.12.2", "ty>=0.0.1a13"]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = [
  "E", # pycodestyle errors
  "W", # pycodestyle warnings
  "F", # pyflakes
  "I", # isort
  "N", # pep8-naming
  "UP", # pyupgrade
  "B", # flake8-bugbear
  "SIM", # flake8-simplify
  "TCH", # flake8-type-checking
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = ["integration: full-pipeline run on the NYC voter fixture (slow; ~1 min)"]

[tool.ty.environment]
python-version = "3.13"
